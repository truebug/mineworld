<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<title>splat-lab2 · sort/readback fix</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script type="importmap">
		{
			"imports": {
				"three": "./vendor/three/three.module.min.js",
				"three/addons/": "./vendor/three/addons/",
				"spark": "./vendor/spark/spark.module.min.js"
			}
		}
	</script>
	<style>
		body { margin: 0; background: #000; overflow: hidden; }
		#hud {
			position: fixed; top: 10px; left: 10px; z-index: 10;
			color: #9fe; font: 12px/1.6 monospace; white-space: pre;
			background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px;
			pointer-events: none; max-width: 92vw;
		}
	</style>
</head>
<body>
	<div id="hud">splat-lab2 loading…</div>
	<script type="module">
		/**
		 * Lab2 = splat-lab + diagnostics.
		 * Root cause (docs/35): fitNum used Number(params.get(k)) — missing
		 * splatScale → Number(null)=0 → mesh.scale=0 → depth NaN → activeSplats=0.
		 */
		import * as THREE from "three";

		const hud = document.getElementById("hud");
		const params = new URLSearchParams(location.search);
		const name = (params.get("splat") || "lab3").replace(/[^a-z0-9_]/gi, "");
		const url = params.get("splatUrl") || ("media/splats/" + name + ".spz");
		const holdCam = params.get("holdCam") !== "0";
		const doOrient = params.get("orient") !== "0";

		/** Query float; missing/empty → default (Number(null)===0 must not win). */
		const fitNum = (k, d) => {
			const raw = params.get(k);
			if (raw == null || raw === "") return d;
			const v = Number(raw);
			return Number.isFinite(v) ? v : d;
		};

		let glErr = 0;
		const origErr = console.error.bind(console);
		console.error = (...a) => { glErr++; origErr(...a); };

		const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
		renderer.setClearColor(0x000000, 1);
		renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		renderer.setSize(innerWidth, innerHeight);
		renderer.xr.enabled = true;
		document.body.appendChild(renderer.domElement);

		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 80);
		camera.position.set(0, 1.6, 3);
		const rig = new THREE.Group();
		rig.add(camera);
		scene.add(rig);

		const { SparkRenderer, SplatMesh } = await import("spark");
		const spark = new SparkRenderer({
			renderer,
			preUpdate: false,
			maxStdDev: Math.sqrt(5),
		});
		rig.add(spark);

		hud.textContent = "loading " + url + " …";
		const fileBytes = new Uint8Array(await (await fetch(url)).arrayBuffer());
		const mesh = new SplatMesh({ fileBytes, fileName: name + ".spz" });
		await mesh.initialized;

		let nSp = 0, opSum = 0, opZero = 0, colSum = 0, scSum = 0;
		mesh.forEachSplat((_i, _c, scales, _q, opacity, color) => {
			nSp++; opSum += opacity; if (opacity < 0.01) opZero++;
			colSum += (color.r + color.g + color.b) / 3;
			scSum += (scales.x + scales.y + scales.z) / 3;
		});
		console.log("[MW] splat-lab splats n=" + nSp +
			" avgOp=" + (opSum / Math.max(nSp, 1)).toFixed(3) +
			" zeroOp%=" + (100 * opZero / Math.max(nSp, 1)).toFixed(0) +
			" avgCol=" + (colSum / Math.max(nSp, 1)).toFixed(3) +
			" avgScale=" + (scSum / Math.max(nSp, 1)).toFixed(4));

		// Arm parity: lab3 Z-up → Three Y-up.
		if (doOrient && /lab3/i.test(url)) {
			mesh.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
		}
		mesh.position.set(fitNum("splatOx", 0), fitNum("splatY", 0), fitNum("splatOz", 0));
		const s = fitNum("splatScale", 1);
		if (s !== 1) mesh.scale.setScalar(s);
		scene.add(mesh);

		mesh.updateMatrixWorld(true);
		let bbox = null;
		try {
			const b = mesh.getBoundingBox(true);
			if (b && !b.isEmpty()) bbox = b;
		} catch { /* fall through */ }
		if (!bbox) {
			const fb = new THREE.Box3().setFromObject(mesh);
			if (!fb.isEmpty()) bbox = fb;
		}
		if (!bbox) {
			bbox = new THREE.Box3(
				new THREE.Vector3(-2.5, -2.5, -2.5), new THREE.Vector3(2.5, 2.5, 2.5));
		}
		const center = bbox.getCenter(new THREE.Vector3());
		const size = bbox.getSize(new THREE.Vector3());
		const radius = Math.max(size.x, size.y, size.z, 0.001);
		console.log("[MW] splat-lab bbox center=" +
			center.toArray().map((v) => v.toFixed(2)).join(",") +
			" size=" + size.toArray().map((v) => v.toFixed(2)).join(",") +
			" meshScale=" + mesh.scale.x.toFixed(3));

		const grid = new THREE.GridHelper(radius * 2, 20, 0x336655, 0x223344);
		grid.position.set(center.x, bbox.min.y, center.z);
		scene.add(grid);
		scene.add(new THREE.AxesHelper(radius * 0.5));
		const probe = new THREE.Mesh(
			new THREE.BoxGeometry(radius * 0.15, radius * 0.15, radius * 0.15),
			new THREE.MeshBasicMaterial({ color: 0xff4488 }));
		probe.position.copy(center);
		scene.add(probe);

		let yaw = 0, pitch = 0.2, dragging = false, lx = 0, ly = 0, orbitR = radius * 0.9;
		const focus = center.clone();
		camera.position.set(center.x, center.y + radius * 0.35, center.z + radius * 0.9);
		camera.lookAt(center);

		addEventListener("mousedown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
		addEventListener("mouseup", () => { dragging = false; });
		addEventListener("mousemove", (e) => {
			if (!dragging || !orbitReady) return;
			yaw -= (e.clientX - lx) * 0.004;
			pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - ly) * 0.004));
			lx = e.clientX; ly = e.clientY;
		});
		addEventListener("wheel", (e) => {
			if (!orbitReady) return;
			orbitR = Math.max(radius * 0.05, Math.min(radius * 8,
				orbitR * (1 + Math.sign(e.deltaY) * 0.12)));
		}, { passive: true });
		addEventListener("resize", () => {
			camera.aspect = innerWidth / innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(innerWidth, innerHeight);
		});

		function readbackStats(sp) {
			const rb = sp && sp.readback32;
			if (!rb || !rb.length) return "rb=none";
			const f32 = new Float32Array(rb.buffer, rb.byteOffset, Math.min(rb.length, 4096));
			let nan = 0, fin = 0, inf = 0;
			for (let i = 0; i < f32.length; i++) {
				const v = f32[i];
				if (Number.isNaN(v)) nan++;
				else if (!Number.isFinite(v)) inf++;
				else fin++;
			}
			return "rb n=" + rb.length +
				" nan%=" + (100 * nan / f32.length).toFixed(0) +
				" inf%=" + (100 * inf / f32.length).toFixed(0) +
				" fin%=" + (100 * fin / f32.length).toFixed(0) +
				" headU32=0x" + (rb[0] >>> 0).toString(16);
		}

		let frames = 0;
		const t0 = performance.now();
		let orbitReady = !holdCam;

		renderer.setAnimationLoop(() => {
			const active = spark.activeSplats;
			if (holdCam && !orbitReady) {
				if (active > 0) {
					orbitReady = true;
					console.log("[lab2] FIRST activeSplats=" + active +
						" after " + (performance.now() - t0).toFixed(0) + "ms");
				} else if (performance.now() - t0 > 8000) {
					orbitReady = true;
					console.warn("[lab2] holdCam timeout 8s — enabling orbit anyway");
				}
			}
			if (orbitReady) {
				const cp = Math.cos(pitch), spn = Math.sin(pitch);
				camera.position.set(
					focus.x + orbitR * cp * Math.sin(yaw),
					focus.y + orbitR * spn,
					focus.z + orbitR * cp * Math.cos(yaw)
				);
				camera.lookAt(focus);
			}
			renderer.render(scene, camera);
			frames++;
			if (frames % 15 === 0) {
				const fps = (frames / ((performance.now() - t0) / 1000)).toFixed(0);
				const ic = spark.geometry ? spark.geometry.instanceCount : "?";
				hud.textContent =
					"splat-lab2 · " + url + "\n" +
					"fps≈" + fps + " · glErr=" + glErr +
					" · meshScale=" + mesh.scale.x.toFixed(3) + "\n" +
					"activeSplats=" + active +
					" instanceCount=" + ic +
					" sorting=" + spark.sorting + "\n" +
					"orbit=" + (orbitReady ? "on" : "HOLD") +
					" · orient=" + doOrient + "\n" +
					readbackStats(spark) + "\n" +
					"drag=orbit · wheel=zoom · ?orient=0 · ?holdCam=0";
			}
		});

		console.log("[MW] splat-lab2 ready", url, { holdCam, doOrient, meshScale: mesh.scale.x });
		setTimeout(() => {
			console.log("[lab2] state@3s:",
				"activeSplats=" + spark.activeSplats,
				"meshScale=" + mesh.scale.x,
				readbackStats(spark));
		}, 3000);
	</script>
</body>
</html>
