# 私房默认：不上公共列表。改密码勿提交 git。
server_name = coolje luanti
server_description = private VoxeLibre
server_announce = false
port = 30000
bind_address = 0.0.0.0
max_users = 6
ipv6_server = false

disallow_empty_password = true
strict_protocol_version_checking = false
default_privs = interact, shout
enable_damage = true
creative_mode = false

# 2C8G 同机节流（与 papermc VIEW_DISTANCE=10 同一思路）
max_block_send_distance = 8
max_simultaneous_block_sends_per_client = 10
server_map_save_interval = 5
unsend_block_interval = 16
active_object_send_range_blocks = 4
